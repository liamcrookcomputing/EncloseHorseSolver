<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Map Painter</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Map Painter</h1>
            <p>Create a map and let the solver find the optimal walls.</p>
        </header>

        <section class="panel">

            <form id="map-form" class="map-form">

                <div class="form-group">
                    <label for="rows">Rows</label>
                    <input
                        type="number"
                        id="rows"
                        name="rows"
                        min="3"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cols">Columns</label>
                    <input
                        type="number"
                        id="cols"
                        name="cols"
                        min="3"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="wall-budget">Wall Budget</label>
                    <input
                        type="number"
                        id="wall-budget"
                        name="wall-budget"
                        min="2"
                        required
                    >
                </div>

                <button class="create-button" type="submit">
                    Create Map
                </button>

            </form>

        </section>

        <section class="panel">

            <h2>Tile Palette</h2>

            <div id="selected-tile" class="tile-palette">

                <button type="button" value="horse">
                    Horse
                </button>

                <button type="button" value="grass">
                    Grass
                </button>

                <button type="button" value="water">
                    Water
                </button>

                <button type="button" value="cherries">
                    Cherries
                </button>

                <button type="button" value="gapple">
                    Golden Apple
                </button>

                <button type="button" value="bees">
                    Bees
                </button>

            </div>

        </section>

        <section class="map-container">
            <div id="map"></div>
        </section>

        <button id="solve-button" class="solve-button" type="button">
            Solve Map
        </button>

    </main>

    <script src="{{ url_for('static', filename='map_painter.js') }}"></script>

</body>
</html>
